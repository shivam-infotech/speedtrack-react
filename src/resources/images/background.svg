<svg width="48px" height="48px" viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="0.2" stdDeviation="0.3" flood-color="rgba(0,0,0,0.3)" />
    </filter>
    <radialGradient id="gradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#e8eaf6; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5c6bc0; stop-opacity:1" />
    </radialGradient>
  </defs>
  <circle cx="5" cy="5" r="4"
          style="fill:url(#gradient); stroke:#1a237e; stroke-width:0.5; filter:url(#shadow);" />
</svg>
